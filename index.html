<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a09" />

    <!--
      Brand first, then the words people type. "FootyBoard" on its own told a
      search engine nothing and was ten characters of a sixty-character slot.
      A colon rather than an em dash: no em dash appears in anything a user
      reads, and a title is read in a tab and in a result.
    -->
    <title>FootyBoard: free online soccer tactics board</title>
    <meta
      name="description"
      content="FootyBoard is an animated, collaborative soccer tactics board. Open a pitch, pick a formation, and move players in seconds."
    />

    <!--
      Open Graph and the Twitter card, static and in the shipped HTML.

      Not injected from React, and that is the whole point rather than a
      preference: social crawlers fetch this file and do not execute JavaScript,
      so a tag added by a component is a tag no crawler will ever see. Until
      these existed, every link posted to Reddit, Discord, WhatsApp, iMessage or
      Slack rendered as a bare grey URL, which for a product whose entire value
      is a picture of a pitch is the difference between a post people click and
      a post they scroll past.

      `og:image` is absolute because a crawler resolves it against nothing. It
      is a photograph of the real board with two real shapes and three real
      arrows on it, not the logo: a logo says a brand exists, a pitch says what
      the thing does before anyone reads a word.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FootyBoard" />
    <meta property="og:url" content="https://www.footyboard.me/" />
    <meta property="og:title" content="FootyBoard: free online soccer tactics board" />
    <meta
      property="og:description"
      content="An animated, collaborative soccer tactics board. Open a pitch, pick a formation, and move players in seconds."
    />
    <meta property="og:image" content="https://www.footyboard.me/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A floodlit tactics board: a 4-3-3 against a 4-4-2, with passing and running arrows drawn between them."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      This file is a shell and a fallback, not the page anybody is served.

      It used to be both, and the comment here used to explain why it carried no
      `<link rel="canonical">` and no per-page `og:url`: Express answers every
      route with this one file, so a canonical pointing at `/` would have told
      Google that `/board` and `/join` were duplicates of the home page and got
      them dropped — the exact opposite of what `sitemap.xml` asks for. That
      reasoning was correct and is now spent. `scripts/prerender.mjs` writes a
      separate file per route at build time, each with its own title,
      description, `og:url` and canonical, so the objection no longer applies to
      any address a person can reach.

      Everything above is therefore the default rather than the answer. It is
      what a route nobody prerendered still gets, and it is what the dev server
      serves, since the prerender runs after `vite build` and dev never builds.

      The tags themselves are still static and still in the shipped HTML for the
      original reason: social crawlers fetch this and do not execute JavaScript,
      so a tag injected by a component is a tag no crawler will ever see.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
